
<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Adesh Dairy Farm</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #fffde7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            color: #1b5e20;
            font-size: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
            color: #333;
        }

        .subtitle {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        .description {
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 22px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1b5e20;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .success {
            display: block;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="header">
            <img
                src="images/logo.png"
                alt="Adesh Dairy Farm Logo"
                class="logo"
            >

            <h1>आदेश डेअरी फार्म</h1>

            <p class="subtitle">
                Jeur (Ba) • Dairy Farm Management
            </p>
        </div>

        <h2>Forgot Password?</h2>

        <p class="description">
            तुमचा registered email टाका. त्यावर Password Reset
            करण्यासाठी OTP पाठवला जाईल.
        </p>

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

        <form id="forgotForm">

            <label for="email">Registered Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="तुमचा registered email टाका"
                autocomplete="email"
                required
            >

            <button type="submit" id="sendButton">
                Send OTP
            </button>

        </form>

        <a href="login.html" class="back">
            ← Login पेजवर परत जा
        </a>

    </main>

    <script>
        const API_BASE = "http://localhost:5000";

        const form = document.getElementById("forgotForm");
        const emailInput = document.getElementById("email");
        const message = document.getElementById("message");
        const button = document.getElementById("sendButton");

        let otpRequestSuccessful = false;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            // OTP पाठवण्याची request आधीच successful असल्यास
            // पुन्हा API call न करता OTP verification पेज उघडा.
            if (otpRequestSuccessful) {
                window.location.href = "verify-reset-otp.html";
                return;
            }

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage(
                    "कृपया registered email address टाका.",
                    "error"
                );
                return;
            }

            button.disabled = true;
            button.textContent = "OTP पाठवत आहे...";
            message.className = "message";

            try {
                const response = await fetch(
                    `${API_BASE}/api/auth/forgot-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "OTP पाठवता आला नाही."
                    );
                }

                sessionStorage.setItem(
                    "passwordResetEmail",
                    email
                );

                showMessage(
                    (data.message || "Request पूर्ण झाली.") +
                    " पुढे जाण्यासाठी Continue करा.",
                    "success"
                );

                // पुढील click हा form submit असला तरी OTP पुन्हा पाठवणार नाही.
                otpRequestSuccessful = true;

                emailInput.readOnly = true;

                button.type = "button";
                button.textContent = "Continue to OTP Verification";
                button.disabled = false;

                button.onclick = function () {
                    window.location.href = "verify-reset-otp.html";
                };

            } catch (error) {
                showMessage(
                    error.message === "Failed to fetch"
                        ? "Backend server सुरू आहे का ते तपासा."
                        : error.message,
                    "error"
                );

                button.disabled = false;
                button.type = "submit";
                button.textContent = "Send OTP";
            }
        });
    </script>

</body>
</html>
