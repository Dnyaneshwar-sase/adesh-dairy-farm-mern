<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Notes - आदेश डेअरी फार्म</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
            color: #344054;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        h1, h2 {
            color: #176b3a;
        }

        .card {
            background: white;
            padding: 24px;
            margin-bottom: 22px;
            border: 1px solid #e1e9e2;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(26, 68, 38, 0.07);
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #d1dfd3;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button, .back-link {
            display: inline-block;
            margin-top: 14px;
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            background: #176b3a;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .delete-button {
            background: #b42318;
        }

        .success {
            color: #176b3a;
        }

        .error {
            color: #b42318;
        }

        .note-date {
            color: #667085;
            font-size: 13px;
        }

        .note-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty {
            color: #667085;
        }

        #message {
            white-space: pre-wrap;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px auto;
                padding: 12px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>📝 Farm Notes</h1>
        <a class="back-link" href="dashboard.html">← Dashboard</a>
    </div>

    <p>तुमच्या डेअरी फार्मच्या महत्त्वाच्या नोंदी येथे जतन करा.</p>

    <div class="card">
        <h2>नवीन Note लिहा</h2>

        <p id="message" role="status" aria-live="polite"></p>

        <form id="noteForm">
            <label for="title">Note चे नाव</label>
            <input
                id="title"
                name="title"
                type="text"
                placeholder="उदा. गाय क्रमांक 2 ची तपासणी"
                maxlength="255"
                required
            >

            <label for="content">Note ची माहिती</label>
            <textarea
                id="content"
                name="content"
                placeholder="तुमची महत्त्वाची माहिती येथे लिहा..."
                required
            ></textarea>

            <button id="saveButton" type="submit">💾 Save Note</button>
        </form>
    </div>

    <h2>जतन केलेल्या Notes</h2>

    <div id="notesList">
        <div class="card">Notes लोड होत आहेत...</div>
    </div>

</div>

<script>
    // Live Vercel Backend URL
    const API_URL =
        "https://adesh-dairy-farm-mern.vercel.app/api/notes";

    const noteForm = document.getElementById("noteForm");
    const notesList = document.getElementById("notesList");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    function getToken() {
        return (
            localStorage.getItem("authToken") ||
            sessionStorage.getItem("authToken")
        );
    }

    function showMessage(text, type = "success") {
        message.textContent = text;
        message.className = type;
    }

    function authHeaders(json = false) {
        const token = getToken();
        const headers = {};

        if (token) {
            headers.Authorization = `Bearer ${token}`;
        }

        if (json) {
            headers["Content-Type"] = "application/json";
        }

        return headers;
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, options);

        if (response.status === 401 || response.status === 403) {
            throw new Error(
                "Login किंवा access मध्ये समस्या आहे. पुन्हा Login करून प्रयत्न करा."
            );
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.message || "Request पूर्ण झाली नाही."
            );
        }

        return data;
    }

    function formatDate(dateValue) {
        const date = new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return "तारीख उपलब्ध नाही";
        }

        return new Intl.DateTimeFormat("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }).format(date);
    }

    function createNoteCard(note) {
        const card = document.createElement("div");
        card.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = note.title || "";

        const date = document.createElement("p");
        date.className = "note-date";
        date.textContent = formatDate(note.createdAt);

        const content = document.createElement("p");
        content.className = "note-content";
        content.textContent = note.content || "";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "🗑 Delete Note";

        deleteButton.addEventListener("click", async () => {
            if (!confirm("ही Note Delete करायची आहे का?")) {
                return;
            }

            deleteButton.disabled = true;

            try {
                await apiRequest(
                    `${API_URL}/${encodeURIComponent(note._id)}`,
                    {
                        method: "DELETE",
                        headers: authHeaders()
                    }
                );

                showMessage("Note Delete झाली.", "success");
                await loadNotes();
            } catch (error) {
                showMessage(error.message, "error");
                deleteButton.disabled = false;
            }
        });

        card.append(heading, date, content, deleteButton);

        return card;
    }

    async function loadNotes() {
        notesList.replaceChildren();

        const loading = document.createElement("div");
        loading.className = "card";
        loading.textContent = "Notes लोड होत आहेत...";
        notesList.appendChild(loading);

        try {
            const notes = await apiRequest(API_URL, {
                method: "GET",
                headers: authHeaders()
            });

            notesList.replaceChildren();

            if (!Array.isArray(notes) || notes.length === 0) {
                const emptyCard = document.createElement("div");
                emptyCard.className = "card empty";
                emptyCard.textContent =
                    "अजून कोणतीही Note जतन केलेली नाही.";

                notesList.appendChild(emptyCard);
                return;
            }

            notes.forEach(note => {
                notesList.appendChild(createNoteCard(note));
            });
        } catch (error) {
            notesList.replaceChildren();

            const errorCard = document.createElement("div");
            errorCard.className = "card error";
            errorCard.textContent = error.message;

            notesList.appendChild(errorCard);
        }
    }

    noteForm.addEventListener("submit", async event => {
        event.preventDefault();

        const title =
            document.getElementById("title").value.trim();

        const content =
            document.getElementById("content").value.trim();

        if (!title || !content) {
            showMessage(
                "कृपया Note चे नाव आणि माहिती लिहा.",
                "error"
            );
            return;
        }

        if (!getToken()) {
            showMessage(
                "Login केलेले नाही. कृपया पुन्हा Login करा.",
                "error"
            );
            return;
        }

        saveButton.disabled = true;
        showMessage("");

        try {
            await apiRequest(API_URL, {
                method: "POST",
                headers: authHeaders(true),
                body: JSON.stringify({ title, content })
            });

            noteForm.reset();

            showMessage(
                "Note यशस्वीपणे Save झाली!",
                "success"
            );

            await loadNotes();
        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            saveButton.disabled = false;
        }
    });

    if (!getToken()) {
        showMessage(
            "Login केलेले नाही. कृपया Login करून Farm Notes उघडा.",
            "error"
        );

        notesList.replaceChildren();

        const loginCard = document.createElement("div");
        loginCard.className = "card error";
        loginCard.textContent =
            "Notes वापरण्यासाठी Login आवश्यक आहे.";

        notesList.appendChild(loginCard);
    } else {
        loadNotes();
    }
</script>
</body>
</html>
