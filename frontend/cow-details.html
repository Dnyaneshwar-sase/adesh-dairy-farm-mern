<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>गायीची संपूर्ण माहिती | आदेश डेअरी फार्म</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans Devanagari", "Segoe UI", Arial, sans-serif;
            color: #20372a;
            background:
                radial-gradient(circle at top left, #dff2dc, transparent 35%),
                linear-gradient(135deg, #f4f8f2, #eaf4e9);
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 30px 22px 45px;
        }

        .page-title {
            text-align: center;
            margin: 0 0 12px;
            color: #176b3a;
            font-size: clamp(26px, 3vw, 36px);
            font-weight: 800;
        }

        .page-subtitle {
            text-align: center;
            color: #718074;
            margin: 0 0 28px;
            font-size: 15px;
        }

        .profile-card {
            max-width: 980px;
            margin: auto;
            padding: 26px;
            background: #fff;
            border: 1px solid #e0eae0;
            border-radius: 24px;
            box-shadow: 0 16px 45px rgba(34, 75, 43, 0.11);
        }

        .photo-area {
            width: 100%;
            height: clamp(280px, 43vw, 490px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            overflow: hidden;
            background: linear-gradient(145deg, #f0f7ef, #e7f1e5);
            border: 1px solid #e0eadf;
            border-radius: 18px;
        }

        .cow-photo {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 12px;
        }

        .photo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            color: #63806a;
        }

        .cow-icon {
            font-size: 80px;
        }

        .photo-placeholder p {
            margin: 0;
            font-size: 15px;
        }

        .profile-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin: 26px 2px 24px;
        }

        .cow-name {
            margin: 0 0 10px;
            color: #176b3a;
            font-size: clamp(27px, 3vw, 36px);
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .cow-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            background: #eaf6e9;
            color: #176b3a;
            border: 1px solid #d6ead4;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .section-title {
            margin: 0 0 17px;
            color: #284c34;
            font-size: 21px;
            font-weight: 800;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .info-box {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            min-width: 0;
            padding: 22px;
            background: #f7faf6;
            border: 1px solid #e0eae0;
            border-radius: 16px;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .info-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(31, 85, 44, .07);
        }

        .info-icon {
            display: flex;
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
            background: #e5f3e3;
            border-radius: 13px;
            font-size: 25px;
        }

        .info-content {
            min-width: 0;
        }

        .info-label {
            display: block;
            margin: 1px 0 9px;
            color: #66806b;
            font-size: 14px;
            font-weight: 600;
        }

        .info-value {
            margin: 0;
            color: #203c29;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.65;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .bottom-actions {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .back-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 52px;
            padding: 14px 20px;
            color: #fff;
            background: linear-gradient(135deg, #198754, #12663b);
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: 750;
            box-shadow: 0 7px 17px rgba(25, 135, 84, .19);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(25, 135, 84, .25);
        }

        .status-message {
            display: none;
            margin: 0 auto 20px;
            max-width: 980px;
            padding: 14px 17px;
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f1aeb5;
            border-radius: 12px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        @media (max-width: 650px) {
            .page {
                padding: 22px 12px 30px;
            }

            .profile-card {
                padding: 13px;
                border-radius: 18px;
            }

            .photo-area {
                height: 300px;
                padding: 8px;
                border-radius: 13px;
            }

            .profile-heading {
                margin: 21px 4px;
                align-items: flex-start;
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .info-box {
                padding: 17px;
            }

            .section-title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <h1 class="page-title">🐄 गायीची संपूर्ण माहिती</h1>

        <p class="page-subtitle">
            आदेश डेअरी फार्म — प्रत्येक गाय, तिची स्वतंत्र ओळख
        </p>

        <div id="errorMessage" class="status-message"></div>

        <section class="profile-card">

            <div class="photo-area">
                <img
                    id="cowPhoto"
                    class="cow-photo"
                    src=""
                    alt="गायीचा फोटो"
                >

                <div id="photoPlaceholder" class="photo-placeholder">
                    <span class="cow-icon">🐄</span>
                    <p id="photoMessage">गायीचा फोटो लोड होत आहे...</p>
                </div>
            </div>

            <div class="profile-heading">
                <div>
                    <h2 id="cowName" class="cow-name">
                        गायीची माहिती लोड होत आहे...
                    </h2>

                    <div class="cow-tag">
                        🏷️ <span id="cowTag">Cow ID</span>
                    </div>
                </div>
            </div>

            <h3 class="section-title">📋 गायीचे तपशील</h3>

            <div class="info-grid">

                <div class="info-box">
                    <div class="info-icon">🐮</div>
                    <div class="info-content">
                        <span class="info-label">जात / Breed</span>
                        <p class="info-value" id="cowBreed">—</p>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-icon">📅</div>
                    <div class="info-content">
                        <span class="info-label">जन्मतारीख</span>
                        <p class="info-value" id="cowDob">—</p>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-icon">❤️</div>
                    <div class="info-content">
                        <span class="info-label">आरोग्य स्थिती</span>
                        <p class="info-value" id="cowHealth">—</p>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-icon">🤰</div>
                    <div class="info-content">
                        <span class="info-label">गर्भधारणा स्थिती</span>
                        <p class="info-value" id="cowPregnancy">—</p>
                    </div>
                </div>

            </div>

            <div class="bottom-actions">
                <a href="cows.html" class="back-button">
                    ← गायींच्या यादीवर परत जा
                </a>
            </div>

        </section>
    </main>

    <script>
        const API_URL =
            "https://adesh-dairy-farm-mern.vercel.app/api/cows";

        const params = new URLSearchParams(window.location.search);
        const cowId = params.get("id");
        const token = localStorage.getItem("authToken");

        const photo = document.getElementById("cowPhoto");
        const placeholder = document.getElementById("photoPlaceholder");
        const photoMessage = document.getElementById("photoMessage");
        const errorMessage = document.getElementById("errorMessage");

        function displayValue(value) {
            if (
                value === undefined ||
                value === null ||
                String(value).trim() === ""
            ) {
                return "माहिती उपलब्ध नाही";
            }

            return String(value);
        }

        function formatDate(value) {
            if (!value) {
                return "माहिती उपलब्ध नाही";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return String(value);
            }

            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function showPhotoPlaceholder(
            message = "या गायीचा फोटो उपलब्ध नाही"
        ) {
            photo.style.display = "none";
            photo.removeAttribute("src");
            photoMessage.textContent = message;
            placeholder.style.display = "flex";
        }

        function loadPhoto(photoPath) {
            const defaultPhoto = "images/default-cow.png";
            let imageUrl;

            if (
                !photoPath ||
                photoPath === "/images/default-cow.png" ||
                photoPath === defaultPhoto
            ) {
                imageUrl = new URL(
                    defaultPhoto,
                    window.location.href
                ).href;
            } else if (
                /^(https?:\/\/|data:image\/)/i.test(photoPath)
            ) {
                imageUrl = photoPath;
            } else if (photoPath.startsWith("/")) {
                imageUrl =
                    "https://adesh-dairy-farm-mern.vercel.app" +
                    photoPath;
            } else {
                imageUrl =
                    "https://adesh-dairy-farm-mern.vercel.app/" +
                    photoPath;
            }

            photo.onload = function () {
                photo.style.display = "block";
                placeholder.style.display = "none";
            };

            photo.onerror = function () {
                showPhotoPlaceholder(
                    "फोटो सापडला नाही. फोटोचा path तपासा."
                );
                console.error("Photo loading failed:", imageUrl);
            };

            photo.style.display = "none";
            placeholder.style.display = "flex";
            photo.src = imageUrl;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        async function loadCowDetails() {
            if (!cowId) {
                document.getElementById("cowName").textContent =
                    "गायीची माहिती उपलब्ध नाही";

                showError(
                    "गायीचा ID मिळाला नाही. गायींच्या यादीतून 'अधिक माहिती' निवडा."
                );

                showPhotoPlaceholder();
                return;
            }

            if (!token) {
                document.getElementById("cowName").textContent =
                    "Login आवश्यक आहे";

                showError(
                    "Login Token मिळाला नाही. कृपया Login करून पुन्हा प्रयत्न करा."
                );

                showPhotoPlaceholder();
                return;
            }

            try {
                const response = await fetch(
                    API_URL + "/" + encodeURIComponent(cowId),
                    {
                        method: "GET",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                if (!response.ok) {
                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        throw new Error(
                            "Login session संपली आहे किंवा परवानगी नाही. पुन्हा Login करा."
                        );
                    }

                    if (response.status === 404) {
                        throw new Error(
                            "ही गाय सापडली नाही. गायींच्या यादीतून पुन्हा निवडा."
                        );
                    }

                    throw new Error(
                        "गायीची माहिती मिळाली नाही. Backend API तपासा."
                    );
                }

                const result = await response.json();
                const cow = result.cow || result.data || result;

                if (!cow || (!cow._id && !cow.id)) {
                    throw new Error(
                        "गायीची योग्य माहिती API मधून मिळाली नाही."
                    );
                }

                document.getElementById("cowName").textContent =
                    displayValue(cow.name);

                document.getElementById("cowTag").textContent =
                    displayValue(
                        cow.cowTag ||
                        cow.tagNumber ||
                        cow._id ||
                        cow.id
                    );

                document.getElementById("cowBreed").textContent =
                    displayValue(cow.breed);

                document.getElementById("cowDob").textContent =
                    formatDate(cow.dateOfBirth);

                document.getElementById("cowHealth").textContent =
                    displayValue(cow.healthStatus);

                document.getElementById("cowPregnancy").textContent =
                    displayValue(cow.pregnancyStatus);

                loadPhoto(cow.photo);

            } catch (error) {
                console.error("Cow details error:", error);

                showError(
                    error.message ||
                    "गायीची माहिती लोड करता आली नाही."
                );

                showPhotoPlaceholder();

                document.getElementById("cowName").textContent =
                    "गायीची माहिती लोड झाली नाही";
            }
        }

        loadCowDetails();
    </script>
</body>
</html>
