
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>फार्म फोटो आणि व्हिडिओ | आदेश डेअरी फार्म</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f7f3;
            color: #164d30;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header,
        .upload-card {
            background: white;
            border: 1px solid #dce9dc;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px #00000008;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1, h2 {
            margin-top: 0;
            color: #176b3a;
        }

        a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 1px dashed #9dbda3;
            border-radius: 9px;
            background: #f8fbf8;
            margin: 8px 0 16px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            background: #198754;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .delete-button {
            background: #dc3545;
            width: 100%;
            margin-top: 10px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin: 14px 0;
            overflow-wrap: anywhere;
        }

        .error {
            background: #fce2e2;
            color: #a51e2b;
        }

        .success {
            background: #e0f5e7;
            color: #176b3a;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }

        .media-card {
            min-width: 0;
            padding: 10px;
            background: white;
            border: 1px solid #dce9dc;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 14px #00000008;
        }

        .media-card img,
        .media-card video {
            display: block;
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
            background: #e8eee8;
        }

        /* फोटोखाली फाइलचे नाव दाखवायचे नाही */
        .media-title,
        .media-filename {
            display: none !important;
        }

        .empty-message {
            color: #6c757d;
            padding: 18px 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .media-card img,
            .media-card video {
                height: 220px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header class="header">
        <h1>फार्म फोटो आणि व्हिडिओ</h1>
        <a href="index.html">मुख्यपृष्ठावर परत जा</a>
    </header>

    <section class="upload-card" id="uploadSection" hidden>
        <h2>फोटो / व्हिडिओ अपलोड करा</h2>

        <form id="uploadForm">
            <input
                type="file"
                id="mediaFile"
                name="media"
                accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime"
                required
            >

            <button type="submit" id="uploadButton">Upload</button>
        </form>

        <div id="uploadMessage" aria-live="polite"></div>
    </section>

    <section>
        <h2>फार्मची गॅलरी</h2>
        <div id="galleryMessage" aria-live="polite"></div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

</div>

<script>
    const API_BASE = "https://adesh-dairy-farm-mern.vercel.app";

    const token = localStorage.getItem("authToken");

    let currentUser = null;

    try {
        currentUser = JSON.parse(
            localStorage.getItem("currentUser") || "null"
        );
    } catch (error) {
        currentUser = null;
    }

    const isOwner =
        currentUser &&
        currentUser.role === "owner" &&
        Boolean(token);

    const uploadSection = document.getElementById("uploadSection");
    const uploadForm = document.getElementById("uploadForm");
    const uploadButton = document.getElementById("uploadButton");
    const mediaFile = document.getElementById("mediaFile");
    const uploadMessage = document.getElementById("uploadMessage");
    const galleryMessage = document.getElementById("galleryMessage");
    const galleryGrid = document.getElementById("galleryGrid");

    if (isOwner) {
        uploadSection.hidden = false;
    }

    function showMessage(element, message, type) {
        element.replaceChildren();

        const div = document.createElement("div");
        div.className = "message " + type;
        div.textContent = message;

        element.appendChild(div);
    }

    function getMediaUrl(item) {
        return item.url || item.filePath || "";
    }

    function getMediaType(item, url) {
        if (item.mediaType === "video") {
            return "video";
        }

        if (item.mediaType === "image") {
            return "image";
        }

        return /\.(mp4|webm|mov)(\?|$)/i.test(url)
            ? "video"
            : "image";
    }

    async function loadGallery() {
        galleryGrid.replaceChildren();
        galleryMessage.replaceChildren();

        try {
            const response = await fetch(`${API_BASE}/api/gallery`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Gallery मिळवता आली नाही.");
            }

            const mediaItems = Array.isArray(data)
                ? data
                : (data.media || []);

            if (mediaItems.length === 0) {
                galleryMessage.textContent =
                    "अजून फोटो किंवा व्हिडिओ अपलोड केलेले नाहीत.";
                return;
            }

            mediaItems.forEach(item => {
                const url = getMediaUrl(item);

                if (!url) {
                    return;
                }

                const card = document.createElement("div");
                card.className = "media-card";

                const type = getMediaType(item, url);
                let mediaElement;

                if (type === "video") {
                    mediaElement = document.createElement("video");
                    mediaElement.controls = true;
                    mediaElement.preload = "metadata";
                } else {
                    mediaElement = document.createElement("img");
                    mediaElement.alt = "आदेश डेअरी फार्म फोटो";
                    mediaElement.loading = "lazy";
                }

                mediaElement.src = url;
                card.appendChild(mediaElement);

                // फोटो/व्हिडिओचे नाव दाखवले जात नाही.
                if (isOwner) {
                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.className = "delete-button";
                    deleteButton.textContent = "Delete";

                    deleteButton.addEventListener("click", async () => {
                        const id = item._id || item.id;

                        if (!id) {
                            alert("या फाइलची ID मिळाली नाही.");
                            return;
                        }

                        if (!confirm("हा फोटो / व्हिडिओ कायमचा Delete करायचा आहे का?")) {
                            return;
                        }

                        deleteButton.disabled = true;

                        try {
                            const deleteResponse = await fetch(
                                `${API_BASE}/api/gallery/${encodeURIComponent(id)}`,
                                {
                                    method: "DELETE",
                                    headers: {
                                        "Authorization": `Bearer ${token}`
                                    }
                                }
                            );

                            const result = await deleteResponse.json();

                            if (!deleteResponse.ok) {
                                throw new Error(
                                    result.message || "फाइल Delete करता आली नाही."
                                );
                            }

                            card.remove();

                            if (galleryGrid.children.length === 0) {
                                galleryMessage.textContent =
                                    "अजून फोटो किंवा व्हिडिओ अपलोड केलेले नाहीत.";
                            }
                        } catch (error) {
                            alert(error.message || "Delete करताना समस्या आली.");
                            deleteButton.disabled = false;
                        }
                    });

                    card.appendChild(deleteButton);
                }

                galleryGrid.appendChild(card);
            });

        } catch (error) {
            showMessage(
                galleryMessage,
                error.message || "Gallery Load करता आली नाही.",
                "error"
            );
        }
    }

    uploadForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (!isOwner) {
            showMessage(
                uploadMessage,
                "फोटो अपलोड करण्यासाठी Owner Login आवश्यक आहे.",
                "error"
            );
            return;
        }

        const file = mediaFile.files[0];

        if (!file) {
            showMessage(uploadMessage, "फोटो किंवा व्हिडिओ निवडा.", "error");
            return;
        }

        if (file.size > 4 * 1024 * 1024) {
            showMessage(
                uploadMessage,
                "फाइलचा आकार 4 MB पेक्षा कमी असावा.",
                "error"
            );
            return;
        }

        const formData = new FormData();
        formData.append("media", file);

        // Backend ला title आवश्यक असल्यास फाइलच्या नावावरून पाठवतो.
        const title = file.name.replace(/\.[^/.]+$/, "");
        formData.append("title", title);
        formData.append("description", "");

        uploadButton.disabled = true;
        uploadButton.textContent = "Uploading...";

        try {
            const response = await fetch(
                `${API_BASE}/api/gallery/upload`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    },
                    body: formData
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Upload अयशस्वी.");
            }

            showMessage(
                uploadMessage,
                data.message || "फोटो / व्हिडिओ अपलोड झाला.",
                "success"
            );

            uploadForm.reset();
            await loadGallery();

        } catch (error) {
            showMessage(
                uploadMessage,
                error.message || "फाइल अपलोड करता आली नाही.",
                "error"
            );
        } finally {
            uploadButton.disabled = false;
            uploadButton.textContent = "Upload";
        }
    });

    loadGallery();
</script>
</body>
</html>
