
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गाभण गायी | आदेश डेअरी फार्म</title>

    <style>
        :root {
            --green: #198754;
            --dark-green: #146c43;
            --light-green: #e9f7ef;
            --background: #f4f8f5;
            --text: #26352b;
            --muted: #6c757d;
            --border: #dee8e1;
            --white: #ffffff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: var(--background);
        }

        .page {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 26px;
            margin-bottom: 24px;
            border-radius: 18px;
            background: linear-gradient(135deg, #146c43, #28a745);
            color: white;
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border-radius: 10px;
            background: white;
            padding: 5px;
        }

        h1 {
            margin: 0 0 8px;
            color: white;
            font-size: 30px;
        }

        .subtitle {
            margin: 0;
            color: #e5f5e9;
            font-size: 15px;
        }

        .back-button {
            display: inline-block;
            min-width: 120px;
            padding: 12px 20px;
            border-radius: 8px;
            background: white;
            color: var(--dark-green);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            transition: 0.2s;
        }

        .back-button:hover {
            background: var(--light-green);
            transform: translateY(-2px);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 24px;
            width: 100%;
        }

        .summary-card {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--white);
            box-shadow: var(--shadow);
        }

        .summary-card p {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 15px;
            font-weight: 600;
        }

        .summary-card strong {
            color: var(--green);
            font-size: 36px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            width: 100%;
        }

        input, select {
            min-height: 44px;
            padding: 10px 14px;
            border: 1px solid #cedbd1;
            border-radius: 8px;
            background: white;
            color: var(--text);
            font: inherit;
            outline: none;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        select {
            min-width: 220px;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: white;
            box-shadow: var(--shadow);
            width: 100%;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th {
            padding: 16px;
            background: var(--light-green);
            color: var(--dark-green);
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #edf1ee;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f7fbf8;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #d1f0dc;
            color: #176b3a;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .empty, .message {
            padding: 25px;
            text-align: center;
            color: var(--muted);
        }

        .error {
            color: #b42318;
        }

        #pageMessage {
            margin-top: 10px;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 20px 16px;
            }

            h1 {
                font-size: 25px;
            }

            .brand {
                gap: 10px;
            }

            .brand-logo img {
                width: 48px;
                height: 48px;
            }

            .summary {
                gap: 12px;
            }

            .summary-card {
                padding: 18px;
            }

            .summary-card strong {
                font-size: 30px;
            }

            input, select {
                width: 100%;
                min-width: 0;
            }
        }

        @media (max-width: 400px) {
            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <header class="header">
        <div class="brand">
            <div class="brand-logo">
                <img src="images/logo.png"
                     alt="Adesh Dairy Farm Logo">
            </div>

            <div>
                <h1>गर्भवती गायी</h1>
                <p class="subtitle">
                    आदेश डेअरी फार्म — गर्भवती गायींची माहिती
                </p>
            </div>
        </div>

        <a class="back-button" href="dashboard.html">
            ← Dashboard
        </a>
    </header>

    <section class="summary">
        <div class="summary-card">
            <p>एकूण गर्भवती गायी</p>
            <strong id="totalPregnant">0</strong>
        </div>

        <div class="summary-card">
            <p>पुढील 15 दिवसांत वेत</p>
            <strong id="calvingSoon">0</strong>
        </div>
    </section>

    <div class="toolbar">
        <input
            type="search"
            id="searchInput"
            placeholder="गायीचे नाव किंवा Cow Tag शोधा..."
        >

        <select id="statusFilter">
            <option value="all">सर्व गर्भवती गायी</option>
            <option value="soon">पुढील 15 दिवसांत वेत</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>अ.क्र.</th>
                    <th>Cow Tag</th>
                    <th>गायीचे नाव</th>
                    <th>जात</th>
                    <th>AI Date</th>
                    <th>अपेक्षित वेताची तारीख</th>
                    <th>स्थिती</th>
                </tr>
            </thead>

            <tbody id="pregnantTableBody">
                <tr>
                    <td colspan="7" class="message">
                        माहिती लोड होत आहे...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p id="pageMessage" class="message" role="status"></p>

</div>

<script>
    // LIVE DEPLOYMENT BACKEND URL
    const API_BASE = "https://adesh-dairy-farm-mern.vercel.app/api";

    const tableBody = document.getElementById("pregnantTableBody");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const pageMessage = document.getElementById("pageMessage");

    let pregnantRecords = [];

    function getToken() {
        return sessionStorage.getItem("authToken")
            || localStorage.getItem("authToken")
            || sessionStorage.getItem("token")
            || localStorage.getItem("token");
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function formatDate(value) {
        if (!value) return "—";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function startOfToday() {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        return date;
    }

    function isPregnant(record) {
        const status = String(record.pregnancyStatus || "")
            .trim()
            .toLowerCase();

        return [
            "pregnant",
            "गर्भवती",
            "गर्भवती आहे"
        ].includes(status);
    }

    function isCalvingSoon(record) {
        if (!record.expectedCalvingDate) {
            return false;
        }

        const today = startOfToday();
        const dueDate = new Date(record.expectedCalvingDate);

        if (Number.isNaN(dueDate.getTime())) {
            return false;
        }

        dueDate.setHours(0, 0, 0, 0);

        const days = Math.floor(
            (dueDate.getTime() - today.getTime()) / 86400000
        );

        return days >= 0 && days <= 15;
    }

    async function loadPregnantCows() {
        const token = getToken();

        if (!token) {
            showError(
                "Login token सापडला नाही. कृपया Login करून पुन्हा प्रयत्न करा."
            );
            return;
        }

        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="message">
                    माहिती लोड होत आहे...
                </td>
            </tr>
        `;

        pageMessage.textContent = "";

        try {
            const response = await fetch(`${API_BASE}/breeding`, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/json"
                }
            });

            if (response.status === 401 || response.status === 403) {
                throw new Error(
                    "Login किंवा access permission तपासा. पुन्हा Login करून पाहा."
                );
            }

            if (!response.ok) {
                throw new Error(
                    `Server error: ${response.status}. Backend API तपासा.`
                );
            }

            const records = await response.json();

            if (!Array.isArray(records)) {
                throw new Error(
                    "Breeding API कडून अपेक्षित array माहिती मिळाली नाही."
                );
            }

            pregnantRecords = records.filter(isPregnant);

            document.getElementById("totalPregnant").textContent =
                pregnantRecords.length;

            document.getElementById("calvingSoon").textContent =
                pregnantRecords.filter(isCalvingSoon).length;

            renderRecords();

        } catch (error) {
            showError(error.message || "माहिती लोड करता आली नाही.");
        }
    }

    function renderRecords() {
        const search = searchInput.value.trim().toLowerCase();
        const filter = statusFilter.value;

        const filtered = pregnantRecords.filter(record => {
            const cow = record.cowId || {};

            const tag = String(cow.cowTag || "").toLowerCase();
            const name = String(cow.name || "").toLowerCase();

            const matchesSearch =
                tag.includes(search) || name.includes(search);

            const matchesFilter =
                filter === "all" || isCalvingSoon(record);

            return matchesSearch && matchesFilter;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        गर्भवती गायींची माहिती उपलब्ध नाही.
                    </td>
                </tr>
            `;
            return;
        }

        tableBody.innerHTML = filtered.map((record, index) => {
            const cow = record.cowId || {};

            return `
                <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(cow.cowTag || "—")}</td>
                    <td>${escapeHtml(cow.name || "—")}</td>
                    <td>${escapeHtml(cow.breed || "—")}</td>
                    <td>${formatDate(record.aiDate)}</td>
                    <td>${formatDate(record.expectedCalvingDate)}</td>
                    <td><span class="status">गाभण</span></td>
                </tr>
            `;
        }).join("");
    }

    function showError(message) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="empty error">
                    ${escapeHtml(message)}
                </td>
            </tr>
        `;

        pageMessage.textContent =
            "माहिती लोड झाली नाही. Backend, API route आणि Login तपासा.";
    }

    searchInput.addEventListener("input", renderRecords);
    statusFilter.addEventListener("change", renderRecords);

    loadPregnantCows();
</script>
</body>
</html>
