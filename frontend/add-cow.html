
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नवीन गाय जोडा | आदेश डेअरी फार्म</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            background: #f3f8f2;
            color: #174d32;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .header, .card {
            background: #fff;
            border: 1px solid #dcebdc;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 5px 20px rgba(20, 80, 40, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        h1, h2 {
            margin-top: 0;
            color: #087443;
        }

        .subtitle {
            color: #66796c;
            line-height: 1.7;
        }

        .navigation {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .button {
            display: inline-block;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            background: #168653;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .button:hover {
            background: #106a40;
        }

        .button.secondary {
            background: #e7f4e7;
            border: 1px solid #cce5cc;
            color: #145c36;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4e3d5;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            color: #244832;
        }

        input:focus, select:focus {
            outline: 2px solid #8ecba5;
            border-color: #168653;
        }

        .preview-box {
            margin-top: 12px;
            display: none;
        }

        #photoPreview {
            max-width: 220px;
            max-height: 220px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid #dcebdc;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            color: #155c32;
            background: #e0f5e5;
            border: 1px solid #a7d9b3;
        }

        .message.error {
            display: block;
            color: #8d2020;
            background: #fde5e5;
            border: 1px solid #f1b5b5;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header, .card {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .logo {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header class="header">
        <img
            class="logo"
            src="/images/logo.png"
            alt="आदेश डेअरी फार्म लोगो"
            onerror="this.style.display='none'"
        >
        <div>
            <h1 style="margin-bottom: 6px;">आदेश डेअरी फार्म</h1>
            <div class="subtitle">आपल्या डेअरीचे स्मार्ट व्यवस्थापन 🐄</div>
        </div>
    </header>

    <nav class="navigation">
        <a class="button secondary" href="dashboard.html">🏠 Dashboard</a>
        <a class="button secondary" href="cows.html">← गायींची यादी</a>
    </nav>

    <main class="card">
        <h2>🐄 नवीन गाय जोडा</h2>
        <p class="subtitle">आदेश डेअरी फार्ममध्ये नवीन गायीची माहिती नोंदवा.</p>

        <div id="message" class="message" role="alert"></div>

        <form id="addCowForm">
            <div class="form-grid">

                <div class="field">
                    <label for="cowTag">गाय ID / Tag Number *</label>
                    <input
                        id="cowTag"
                        name="cowTag"
                        type="text"
                        placeholder="उदा. AD002"
                        required
                    >
                </div>

                <div class="field">
                    <label for="name">गायीचे नाव</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="उदा. लक्ष्मी"
                    >
                </div>

                <div class="field">
                    <label for="breed">जात / Breed</label>
                    <input
                        id="breed"
                        name="breed"
                        type="text"
                        placeholder="उदा. HF, जर्सी"
                    >
                </div>

                <div class="field">
                    <label for="dateOfBirth">जन्मतारीख</label>
                    <input
                        id="dateOfBirth"
                        name="dateOfBirth"
                        type="date"
                    >
                </div>

                <div class="field">
                    <label for="healthStatus">आरोग्य स्थिती</label>
                    <select id="healthStatus" name="healthStatus">
                        <option value="निरोगी">निरोगी</option>
                        <option value="आजारी">आजारी</option>
                        <option value="उपचार सुरू">उपचार सुरू</option>
                        <option value="Healthy">Healthy</option>
                    </select>
                </div>

                <div class="field">
                    <label for="pregnancyStatus">गर्भधारणा स्थिती</label>
                    <select id="pregnancyStatus" name="pregnancyStatus">
                        <option value="माहित नाही">माहित नाही</option>
                        <option value="गाभण">गाभण</option>
                        <option value="गाभण नाही">गाभण नाही</option>
                        <option value="Pregnant">Pregnant</option>
                        <option value="Not Pregnant">Not Pregnant</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="photoFile">गायीचा फोटो (ऐच्छिक)</label>
                    <input
                        id="photoFile"
                        name="photoFile"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <div class="subtitle">
                        JPG, PNG किंवा WEBP फोटो निवडा. कमाल आकार 4 MB.
                    </div>

                    <div id="previewBox" class="preview-box">
                        <img id="photoPreview" alt="गायीच्या फोटोचे Preview">
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <button id="saveButton" class="button" type="submit">
                    💾 गायीची नोंद करा
                </button>

                <a href="cows.html" class="button secondary">
                    रद्द करा
                </a>
            </div>
        </form>
    </main>
</div>

<script>
"use strict";

// Production Backend API
const API_URL = "https://adesh-dairy-farm-mern.vercel.app/api/cows";

const form = document.getElementById("addCowForm");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");
const photoInput = document.getElementById("photoFile");
const photoPreview = document.getElementById("photoPreview");
const previewBox = document.getElementById("previewBox");

let previewObjectUrl = null;

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

function clearMessage() {
    message.textContent = "";
    message.className = "message";
}

function getAuthToken() {
    const possibleKeys = [
        "token",
        "authToken",
        "userToken",
        "dairyToken",
        "accessToken"
    ];

    for (const key of possibleKeys) {
        const value = localStorage.getItem(key);

        if (value && value.trim()) {
            return value.trim().replace(/^Bearer\s+/i, "");
        }
    }

    return "";
}

// फोटो Preview
photoInput.addEventListener("change", function () {
    clearMessage();

    if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
    }

    photoPreview.removeAttribute("src");
    previewBox.style.display = "none";

    const file = photoInput.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {
        photoInput.value = "";
        showMessage("कृपया योग्य फोटो निवडा.", "error");
        return;
    }

    if (file.size > 4 * 1024 * 1024) {
        photoInput.value = "";
        showMessage("फोटोचा आकार 4 MB पेक्षा कमी असावा.", "error");
        return;
    }

    previewObjectUrl = URL.createObjectURL(file);
    photoPreview.src = previewObjectUrl;
    previewBox.style.display = "block";
});

// गाय नोंदवणे
form.addEventListener("submit", async function (event) {
    event.preventDefault();
    clearMessage();

    const token = getAuthToken();

    if (!token) {
        showMessage(
            "Login आवश्यक आहे. कृपया पुन्हा Login करून ही फाइल उघडा.",
            "error"
        );
        return;
    }

    const cowTag = document.getElementById("cowTag").value.trim();

    if (!cowTag) {
        showMessage("गाय ID / Tag Number आवश्यक आहे.", "error");
        return;
    }

    const photo = photoInput.files[0];

    if (photo && photo.size > 4 * 1024 * 1024) {
        showMessage("फोटोचा आकार 4 MB पेक्षा कमी असावा.", "error");
        return;
    }

    const formData = new FormData();

    formData.append("cowTag", cowTag);
    formData.append(
        "name",
        document.getElementById("name").value.trim()
    );
    formData.append(
        "breed",
        document.getElementById("breed").value.trim()
    );
    formData.append(
        "dateOfBirth",
        document.getElementById("dateOfBirth").value
    );
    formData.append(
        "healthStatus",
        document.getElementById("healthStatus").value
    );
    formData.append(
        "pregnancyStatus",
        document.getElementById("pregnancyStatus").value
    );

    // Backend uses upload.single("photoFile")
    if (photo) {
        formData.append("photoFile", photo);
    }

    saveButton.disabled = true;
    saveButton.textContent = "नोंद करत आहे...";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            },
            body: formData
        });

        const result = await response.json().catch(function () {
            return {};
        });

        if (response.status === 401 || response.status === 403) {
            throw new Error(
                result.message ||
                "Login किंवा Owner परवानगी तपासा. पुन्हा Login करा."
            );
        }

        if (!response.ok) {
            throw new Error(
                result.message ||
                "गायीची नोंद करता आली नाही. Backend तपासा."
            );
        }

        showMessage(
            result.message || "गायीची नोंद यशस्वी झाली!",
            "success"
        );

        form.reset();

        if (previewObjectUrl) {
            URL.revokeObjectURL(previewObjectUrl);
            previewObjectUrl = null;
        }

        photoPreview.removeAttribute("src");
        previewBox.style.display = "none";

    } catch (error) {
        console.error("Add Cow Error:", error);

        showMessage(
            error.message === "Failed to fetch"
                ? "Backend शी संपर्क होत नाही. Vercel Backend आणि CORS तपासा."
                : error.message,
            "error"
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "💾 गायीची नोंद करा";
    }
});
</script>
</body>
</html>
